name: Build LEDERG CRMP Direct Launcher (Windows x86)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launcher-source.tar.gz.b64'
      - '.github/workflows/build-crmp-launcher.yml'

concurrency:
  group: lederd-crmp-launcher-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up 32-bit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x86'

      - name: Verify x86 runtime and unpack source
        shell: pwsh
        run: |
          python -c "import struct,sys; print(sys.version); assert struct.calcsize('P') == 4, 'Build must use 32-bit Python'"
          python -c "import base64,pathlib; p=pathlib.Path('launcher-source.tar.gz.b64'); data=p.read_bytes(); data += b'=' * (-len(data) % 4); pathlib.Path('source.tar.gz').write_bytes(base64.b64decode(data, validate=True))"
          python -c "import tarfile; tarfile.open('source.tar.gz','r:gz').extractall('source')"

      - name: Install build and test tools
        working-directory: source
        run: python -m pip install --upgrade pyinstaller pytest

      - name: Run tests
        working-directory: source
        run: python -m pytest -q

      - name: Build one-file Windows x86 EXE
        working-directory: source
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name LEDERG_CRMP_Launcher
          --icon assets/lederg.ico
          --version-file version_info.txt
          launcher.py

      - name: Verify PE architecture
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes('source/dist/LEDERG_CRMP_Launcher.exe')
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Not a PE executable' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x014C) { throw ('Expected x86 PE machine 0x014C, got 0x{0:X4}' -f $machine) }
          Write-Host 'Verified: PE32 x86 Windows GUI executable.'

      - name: Upload direct launcher EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDERG-CRMP-DIRECT-LAUNCHER-WIN32
          path: source/dist/LEDERG_CRMP_Launcher.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish portable EXE and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'public-downloads' | Out-Null
          Copy-Item 'source/dist/LEDERG_CRMP_Launcher.exe' 'public-downloads/LEDERG_CRMP_Launcher.exe' -Force
          $hash = (Get-FileHash 'public-downloads/LEDERG_CRMP_Launcher.exe' -Algorithm SHA256).Hash.ToLower()
          Set-Content -LiteralPath 'public-downloads/LEDERG_CRMP_Launcher.sha256' -Value "$hash  LEDERG_CRMP_Launcher.exe" -NoNewline
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-downloads/LEDERG_CRMP_Launcher.exe public-downloads/LEDERG_CRMP_Launcher.sha256
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Publish verified LEDERG CRMP direct launcher'
            git push origin HEAD:main
          } else {
            Write-Host 'Portable launcher is already up to date.'
          }

      - name: Publish build status (even on failure)
        if: always()
        shell: pwsh
        run: |
          $status = "${{ job.status }}"
          $commit = "${{ github.sha }}"
          $text = @"
          LEDERG CRMP launcher build
          Status: $status
          Commit: $commit
          Workflow: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          "@
          New-Item -ItemType Directory -Force -Path 'public-downloads' | Out-Null
          Set-Content -LiteralPath 'public-downloads/BUILD_STATUS.txt' -Value $text -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-downloads/BUILD_STATUS.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Record LEDERG CRMP launcher build status'
            git push origin HEAD:main
          }
