name: Build LEDERG CRMP Launcher

on:
  push:
    branches: [main]
    paths:
      - 'launcher-source.tar.gz.b64'
      - '.github/workflows/build-crmp-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decode source bundle
        shell: pwsh
        run: |
          python -c "import base64, pathlib; pathlib.Path('source.tar.gz').write_bytes(base64.b64decode(pathlib.Path('launcher-source.tar.gz.b64').read_bytes()))"
          python -c "import tarfile; tarfile.open('source.tar.gz', 'r:gz').extractall('source')"

      - name: Install build and test dependencies
        working-directory: source
        run: python -m pip install --upgrade pyinstaller pytest

      - name: Run tests
        working-directory: source
        run: python -m pytest -q

      - name: Build one-file Windows EXE
        working-directory: source
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name LEDERG_CRMP_Launcher
          --icon assets/lederg.ico
          --version-file version_info.txt
          launcher.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDERG-CRMP-LAUNCHER-WINDOWS
          path: source/dist/LEDERG_CRMP_Launcher.exe
          if-no-files-found: error
          retention-days: 30
